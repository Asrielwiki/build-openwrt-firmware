name: OpenWrt optimize - apkmode #此编译yml文件可节省大量磁盘空间，但对于Pro权益过期后，实际的编译所耗时间有待验证

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: apkmodeseed.config
  DIY_P1_SH: diy-part1.sh
  CLASH_KERNEL: amd64
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: false
  FIRMWARE_TAG: X86_64
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        if [ -n "$(docker images -q)" ]; then docker rmi $(docker images -q); fi
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL is.gd/depends_ubuntu_2204) qemu-utils
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone Source Code
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        COMMIT_DATE=$(git show -s --date=short --format="时间: %ci")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        COMMIT_HASH=$(git show -s --date=short --format="hash: %H")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

    - name: Load Custom Configuration
      run: |
          chmod +x $DIY_P1_SH
          cd $OPENWRT_PATH
          $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Install Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -f -a
        #./scripts/feeds install -f libxcrypt

    - name: Generate Variables
      run: |
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-apkmode-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Download DL Package
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        mkdir -p files/etc/uci-defaults

        # 1. ⚡【核心修复】优先编译 host 宿主机工具链（彻底解决 staging_dir/host/bin/m4 failed）
        echo "==== Step 1: Build host tools ===="
        make tools/compile -j$(nproc) || make tools/compile -j1 V=s
        make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s

        # 2. 🛡️ 让内核单独、单线程稳固初始化（彻底解决 pppox.ko missing 报错）
        echo "==== Step 2: Secure Kernel Build ===="
        make target/linux/compile -j1 V=s

        # 3. 🚀 多线程全速编译所有上层软件包（此时地基全稳，绝无后顾之忧）
        echo "==== Step 3: Compiling packages ===="
        make package/compile -j$(nproc) || make package/compile -j1 V=s

        # 4. 📂 强行生成打包必须的 packages.adb 索引，并拷贝到打包脚本犯蠢找不到的那个路径
        echo "==== Step 4: Generating APK Index ===="
        make package/index V=s
        mkdir -p staging_dir/packages/x86/
        cp -f bin/packages/x86_64/base/packages.adb staging_dir/packages/x86/packages.adb 2>/dev/null || true
        cp -f bin/targets/x86/64/packages/packages.adb staging_dir/packages/x86/packages.adb 2>/dev/null || true

        # 5. 📦 最后执行完美的固件打包封装
        echo "==== Step 5: Building target images ===="
        make target/compile -j$(nproc) || make target/compile -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    # 🌟【时序与变量修正 3】利用 GITHUB_OUTPUT 彻底解决跨步骤路径传递丢失问题，改 mv 为 cp 留存底子
    - name: Organize Files
      id: organize
      if: always() && (steps.compile.outcome == 'success' || steps.compile.outputs.status == 'success')
      run: |
        # 1. 进入固件产物核心目录
        cd $OPENWRT_PATH/bin/targets/*/*
        
        # 2. 🛡️ 安全读取校验和
        cat sha256sums 2>/dev/null || echo "⚠️ 未找到 sha256sums，跳过打印"
        
        # 3. 备份编译配置
        cp -f $OPENWRT_PATH/.config build.config 2>/dev/null || true
        
        # 4. 📦 创建一个临时收集箱，用来确保所有固件和包都万无一失
        mkdir -p packages
        
        # 5. 🔥【核心修复】全方位通杀固件和安装包
        # 捞取当前目录下所有可能的固件文件（.bin, .img, .img.gz 等）以及包文件（.apk, .ipk）
        cp -f *.bin *.img *.img.gz *.qcow2 *.manifest build.config packages/ 2>/dev/null || true
        cp -f *.apk *.ipk packages/ 2>/dev/null || true
        
        # 捞取 bin/packages 下的所有第三方 APK/IPK 组件
        cp -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages/ 2>/dev/null || true
        cp -f $OPENWRT_PATH/bin/packages/*/*/*.ipk packages/ 2>/dev/null || true
        
        # 6. 将当前文件夹内的所有产物，以及收集箱，统一打包！
        # 这样不管固件文件是在外面还是在里面，都会被绝对强制收纳进这个压缩包
        tar -zcf Packages.tar.gz packages/*
        
        # 清理多余临时文件，但保留 Packages.tar.gz
        rm -rf packages feeds.buildinfo version.buildinfo
        
        # 7. 🛠️ 安全提取内核版本号
        echo "KERNEL=$(cat *.manifest 2>/dev/null | grep ^kernel | cut -d- -f2 | tr -d ' ' || echo 'unknown')" >> $GITHUB_ENV
        
        # 8. 🌟 输出路径
        echo "firmware_path=$PWD" >> $GITHUB_OUTPUT

    - name: Upload Firmware To Artifact
      # 🌟 修复判断条件：与上一步 organize 的成功状态对齐，且确保不是被取消的
      if: always() && (steps.organize.outcome == 'success' || steps.compile.outputs.status == 'success') && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        # 🌟 修复路径：直接精准调用上一步 organize 吐出来的绝对路径
        path: ${{ steps.organize.outputs.firmware_path }}

    - name: Upload Firmware To Release
      # 🌟 修复判断条件：只有在前一步整理文件成功，且你开启了 RELEASE 开关时才触发
      if: always() && (steps.organize.outcome == 'success' || steps.compile.outputs.status == 'success') && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        # 🌟 修复硬编码路径：原本的 ${{ env.FIRMWARE_PATH }} 可能不准，直接改用我们整理好的 firmware_path
        artifacts: ${{ steps.organize.outputs.firmware_path }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 📒 固件信息
          - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🚀 内核版本: ${{ env.KERNEL }}
          - 🌐 默认地址: 192.168.1.1
          - 🔑 默认密码: password
          ### 🧊 固件版本
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.COMMIT_AUTHOR }}
          - ${{ env.COMMIT_DATE }}
          - ${{ env.COMMIT_MESSAGE }}
          - ${{ env.COMMIT_HASH }}
